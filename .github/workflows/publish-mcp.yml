name: Publish to MCP Registry

# The registry verifies the npm version exists before registering it, so npm must be
# published first. Manual trigger only, with a preflight that says so plainly.
on:
  workflow_dispatch:

env:
  MCP_PUBLISHER_VERSION: 1.8.1

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the version is already published to npm
        run: |
          v=$(node -p "require('./package.json').version")
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/mcp-postgres-server/$v")
          test "$code" = "200" \
            || { echo "mcp-postgres-server@$v is not on npm yet (HTTP $code). Publish to npm first, then run this workflow."; exit 1; }

      - name: Check server.json version matches package.json
        run: |
          pkg=$(node -p "require('./package.json').version")
          srv=$(node -p "require('./server.json').version")
          nested=$(node -p "require('./server.json').packages[0].version")
          test "$pkg" = "$srv" && test "$pkg" = "$nested" \
            || { echo "version mismatch: package.json=$pkg server.json=$srv packages[0]=$nested"; exit 1; }

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher

      - run: ./mcp-publisher validate

      - run: ./mcp-publisher login github-oidc

      - run: ./mcp-publisher publish
